            - text: ", we show multiple datasets and settings required for training, corresponding implementation details, quantitative result comparisons under various settings, complete ablation studies, qualitative visualization results and other optional setup attempts. Finally, in Section"
            - link "5" [ref=e245] [cursor=pointer]:
