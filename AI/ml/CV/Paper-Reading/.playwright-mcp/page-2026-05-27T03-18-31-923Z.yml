                - text: ","
                - link "21" [ref=e4211] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2404.02544v4#bib.bib21
                - text: "]"
              - text: . Without bells and whistles, we achieved uncontroversial SOTA results on the full-range HPE dataset DAD-3DHeads. And all visualization results shown in this paper are estimated based on the optimal model obtained under this setting.
            - paragraph [ref=e4213]:
              - text: Performance Improvement Analysis of SemiUHPE. To systematically understand the source of improvement after boosting FisherMatch with our proposed strategies, we further calculate and plot the head pose error gains on datasets AFLW2000 for front-range HPE under Setting2 (Fig.
              - link "10a" [ref=e4214] [cursor=pointer]:
                - /url: https://arxiv.org/html/2404.02544v4#S4.F10.sf1
              - text: ) and DAD-3DHeads for full-range HPE under Setting3 (Fig.
              - link "10b" [ref=e4215] [cursor=pointer]:
                - /url: https://arxiv.org/html/2404.02544v4#S4.F10.sf2
              - text: ). We split all the testing images into different groups according to their GT yaw angles and calculate the improved error degree within each group. We can find that the improvement by our SemiUHPE gets more obvious as the head pose becomes more challenging and has a larger yaw angle (e.g.,
              - math [ref=e4216]:
                - generic [ref=e4218]:
                  - generic [ref=e4219]: ">"
                  - generic [ref=e4220]:
                    - generic [ref=e4221]: "90"
                    - generic [ref=e4222]: ∘
              - text: ). This capability benefits from unsupervised joint training using a large number of human heads collected in any orientation.
            - paragraph [ref=e4224]:
              - text: Results of SemiObjRot. The experiment results on Pascal3D+ dataset of generic object rotation regression are shown in Table
              - link "VI" [ref=e4225] [cursor=pointer]:
                - /url: https://arxiv.org/html/2404.02544v4#S4.T6
              - text: . The results illustrate that, with using the effective teacher-student mutual learning framework as well as our proposed SSL strategies (including the dynamic entropy-based pseudo label filtering and two advanced strong augmentations), our SemiObjRot significantly outperforms various baselines and three state-of-the-art methods (including FisherMatch, FisherMatch+, and the adapted SAA) under all different numbers of labeled images. This is strong evidence of the undisputed superiority and valuable versatility of our approach.
            - paragraph [ref=e4227]:
