            - paragraph [ref=e4177]:
              - text: Front-range HPE Results under Setting1. As shown in Table
              - link "II" [ref=e4178] [cursor=pointer]:
                - /url: https://arxiv.org/html/2404.02544v4#S4.T2
              - text: ", our SemiUHPE can surpass both the supervised methods"
              - generic [ref=e4179]:
                - text: "["
                - link "39" [ref=e4180] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2404.02544v4#bib.bib39
                - text: "]"
              - text: and baseline FisherMatch
              - generic [ref=e4181]:
                - text: "["
                - link "36" [ref=e4182] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2404.02544v4#bib.bib36
                - text: "]"
              - text: with either backbone. When using ResNet50, our SemiUHPE is always the best out of other three SSL methods (Base., Base.+ and SSA). Meanwhile, the smaller the ratio of labeled samples used (from 20% to 2%), the more significant the reduction in MAE errors. Moreover, with using 20% labeled 300W-LP, the performance of semi-supervised baseline and our SemiUHPE can always exceed the supervised method using all labeled 300W-LP. These results are also comparable to some SOTA supervised methods in Table
              - link "III" [ref=e4183] [cursor=pointer]:
                - /url: https://arxiv.org/html/2404.02544v4#S4.T3
              - text: . We attribute this to the stronger robustness brought by partially integrated unsupervised training of unlabeled data. It also indicates that pure supervised learning may cause final models overfitting on the train-set, while SSL can improve the adaptability and generalization to a certain extent.
            - paragraph [ref=e4185]:
              - text: Front-range HPE Results under Setting2. As shown in Table
              - link "III" [ref=e4186] [cursor=pointer]:
                - /url: https://arxiv.org/html/2404.02544v4#S4.T3
              - text: ", with the supporting of SSL, our method based on ResNet50 can achieve a low MAE result 3.37, which is comparable to other supervised SOTA front-range HPE methods such as DAD-3DNet"
              - generic [ref=e4187]:
                - text: "["
                - link "16" [ref=e4188] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2404.02544v4#bib.bib16
                - text: "]"
              - text: with MAE 3.66, SynergyNet
              - generic [ref=e4189]:
                - text: "["
                - link "10" [ref=e4190] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2404.02544v4#bib.bib10
                - text: "]"
              - text: with MAE 3.35 and DSFNet-f
              - generic [ref=e4191]:
                - text: "["
                - link "61" [ref=e4192] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2404.02544v4#bib.bib61
                - text: "]"
              - text: with MAE 3.25. Please note that all of them are 3DMM-based which require dense face landmark labels and complex 3D face reconstruction pipelines. While, our SemiUHPE only requires reasonable excavation of unlabeled wild heads, which is more practical and scalable in real applications. Comparing to other three SSL baselines (Base., Base.+ and SSA), our method still outperforms them under this full-range setting. When using a stronger backbone such as RepVGG as in 6DRepNet
              - generic [ref=e4193]:
                - text: "["
                - link "20" [ref=e4194] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2404.02544v4#bib.bib20
                - text: "]"
              - text: ", our method can obtain a lower result with MAE 3.35, which further explains its generality and advantage. In particular, after adopting the superior backbone EfficientNetV2-S, we can further reduce the MAE errors into 3.31, which achieved the second best performance so far."
            - paragraph [ref=e4196]:
              - text: Full-range HPE Results under Setting3. As shown in Table
              - link "IV" [ref=e4197] [cursor=pointer]:
                - /url: https://arxiv.org/html/2404.02544v4#S4.T4
              - text: ", results of Img2Pose"
              - generic [ref=e4198]:
                - text: "["
                - link "14" [ref=e4199] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2404.02544v4#bib.bib14
                - text: "]"
              - text: and DAD-3DNet
              - generic [ref=e4200]:
                - text: "["
                - link "16" [ref=e4201] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2404.02544v4#bib.bib16
                - text: "]"
              - text: are obtained from the paper
              - generic [ref=e4202]:
                - text: "["
                - link "16" [ref=e4203] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2404.02544v4#bib.bib16
                - text: "]"
              - text: ", except for results of DAD-3DNet on the val-set which are evaluated by us using its official model. The supervised method is implemented on DAD-3DHeads train-set. Generally, our SemiUHPE significantly surpasses the compared DAD-3DNet and retrained baselines without using any 3D information of face or head, which again proves its superiority and versatility. By expanding the unsupervised dataset (e.g., only COCOHead) to a larger one, which is the combination of COCOHead, CrowdHuman and OpenImageV6 with totally about 403K heads, our method (with marker *) finally achieved lower pose estimation errors on both val-set and test-set. More than that, we give detailed comparison under different conditions in Table"
              - link "V" [ref=e4204] [cursor=pointer]:
                - /url: https://arxiv.org/html/2404.02544v4#S4.T5
              - text: . Our method is still clearly ahead in many challenging cases such as atypical poses, compound expressions, heavy occlusions and non-strandard light. These are common scenes of in-the-wild head images, which are less-touched by the mainstream HPE studies
              - generic [ref=e4205]:
                - text: "["
