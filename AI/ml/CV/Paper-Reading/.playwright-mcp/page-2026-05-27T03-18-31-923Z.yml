        - generic [ref=e4898]:
          - heading "5 Conclusion and Discussion" [level=2] [ref=e4899]:
            - generic [ref=e4900]: "5"
            - text: Conclusion and Discussion
          - paragraph [ref=e4902]: In this paper, we aim to address the unconstrained head pose estimation task on less-touched wild head images. Due to the lack of corresponding labels, we turn to semi-supervised learning techniques. Based on empirically effective frameworks, we propose the dynamic entropy-based filtering for gradually updating thresholds and head-oriented strong augmentations for better enforcing consistency training. By combining the proposed aspect-ratio invariant cropping, our method can achieve optimal HPE performance quantitatively and qualitatively on omnidirectional wild heads. We also demonstrate the scalability and versatility of SemiUHPE on generic object rotation regression and 3D head reconstruction. We expect that our work will greatly inspire related downstream applications.
          - paragraph [ref=e4904]: Last but not least, although our method has achieved stunning results in estimating the pose of wild head, there are still many aspects worth exploring in depth. We summarize the possible perspectives for future research as follows.
          - list [ref=e4906]:
            - listitem [ref=e4907]:
              - text: •
              - paragraph [ref=e4909]: Domain gaps among datasets. Strictly speaking, there are conspicuous differences between labeled and unlabeled datasets we used in this paper. For example, the labeled 300W-LP is artificially synthesized through the face profiling algorithm with artifacts, while the unlabeled COCOHead is collected in the wild containing realistic and natural samples. We may utilize domain adaptation strategies to alleviate this problem.
            - listitem [ref=e4910]:
              - text: •
              - paragraph [ref=e4912]:
                - text: Combination with vision-language models. Recently, large vision-language models (VLMs) and multimodal LLMs (mLLMs) have demonstrated strong generalizable visual reasoning abilities by aligning image and text inputs. Beyond using text descriptions to mitigate data scarcity
                - generic [ref=e4913]:
                  - text: "["
                  - link "108" [ref=e4914] [cursor=pointer]:
                    - /url: https://arxiv.org/html/2404.02544v4#bib.bib108
                  - text: "]"
                - text: or to improve robustness in HPE
                - generic [ref=e4915]:
                  - text: "["
                  - link "109" [ref=e4916] [cursor=pointer]:
                    - /url: https://arxiv.org/html/2404.02544v4#bib.bib109
                  - text: "]"
                - text: ", a more concrete strategy is to cast unconstrained HPE into a visual question answering (VQA) task. For example, both the cropped head image and its reconstructed 3D mesh can be provided to an mLLM, together with a query about the plausibility of the estimated pose. If the mLLM detects a severe error, the system can re-estimate after small perturbations or reject the prediction. Our preliminary test with Gemini 2.5 Flash shows that it can reliably flag most obvious errors, suggesting a promising future direction."
            - listitem [ref=e4917]:
              - text: •
              - paragraph [ref=e4919]:
                - text: More accurate head pose estimation. Our method still cannot address some hard cases shown in Fig.
                - link "14" [ref=e4920] [cursor=pointer]:
                  - /url: https://arxiv.org/html/2404.02544v4#S4.F14
                - text: ", where most facial features are missing due to severe occlusion or backward orientation. A potential remedy is to leverage contextual cues beyond the cropped head. For instance, the orientation of the upper body"
                - generic [ref=e4921]:
                  - text: "["
                  - link "6" [ref=e4922] [cursor=pointer]:
                    - /url: https://arxiv.org/html/2404.02544v4#bib.bib6
                  - text: ","
                  - link "110" [ref=e4923] [cursor=pointer]:
                    - /url: https://arxiv.org/html/2404.02544v4#bib.bib110
                  - text: "]"
                - text: "can provide a strong prior: if the torso clearly faces away from the camera, the head pose should be consistent with a back-of-head orientation. Similarly, surrounding information such as hair-dominated regions with absent facial features"
                - generic [ref=e4924]:
                  - text: "["
                  - link "111" [ref=e4925] [cursor=pointer]:
                    - /url: https://arxiv.org/html/2404.02544v4#bib.bib111
                  - text: ","
                  - link "53" [ref=e4926] [cursor=pointer]:
                    - /url: https://arxiv.org/html/2404.02544v4#bib.bib53
                  - text: "]"
                - text: can help detect backward heads where the yaw absolute angle must exceed
                - math [ref=e4927]:
                  - generic [ref=e4929]:
                    - generic [ref=e4930]: "90"
                    - generic [ref=e4931]: ∘
                - text: . Integrating such priors may effectively reduce catastrophic errors that cannot be solved by single-frame appearance cues alone.
            - listitem [ref=e4932]:
              - text: •
              - paragraph [ref=e4934]: Video-level HPE extension. While our SemiUHPE current focuses on single-frame, applying it to video sequences may lead to temporal jitter or abrupt errors, especially for backward-facing heads. A promising direction is to incorporate temporal consistency constraints, ensuring smooth pose transitions across consecutive frames. Another possibility is to exploit short-term temporal windows, where neighboring frames provide complementary cues to disambiguate extreme poses. Such extensions could further enhance the robustness of SemiUHPE in real-world video applications.
            - listitem [ref=e4935]:
              - text: •
              - paragraph [ref=e4937]:
                - text: Video-based SemiUHPE. Another promising extension is to move from single-frame SemiUHPE to video-based semi-supervised head pose estimation. By redesigning the backbone to process short frame sequences, the model could implicitly capture temporal head-motion cues and output smooth 3D pose trajectories. A teacher–student framework built on annotated video datasets (e.g., BIWI
                - generic [ref=e4938]:
                  - text: "["
                  - link "21" [ref=e4939] [cursor=pointer]:
                    - /url: https://arxiv.org/html/2404.02544v4#bib.bib21
                  - text: "]"
                - text: ", CMU Panoptic"
                - generic [ref=e4940]:
                  - text: "["
                  - link "112" [ref=e4941] [cursor=pointer]:
                    - /url: https://arxiv.org/html/2404.02544v4#bib.bib112
                  - text: "]"
                - text: ) together with large-scale unlabeled online videos would provide a natural baseline. This direction also parallels recent advances in sequential visuomotor imitation learning, where temporal visual observations are mapped to continuous 6DoF trajectories, suggesting that frameworks such as ACT
                - generic [ref=e4942]:
                  - text: "["
                  - link "113" [ref=e4943] [cursor=pointer]:
                    - /url: https://arxiv.org/html/2404.02544v4#bib.bib113
                  - text: "]"
                - text: or Diffusion Policy
                - generic [ref=e4944]:
                  - text: "["
                  - link "114" [ref=e4945] [cursor=pointer]:
                    - /url: https://arxiv.org/html/2404.02544v4#bib.bib114
                  - text: "]"
                - text: could be adapted for head pose estimation.
            - listitem [ref=e4946]:
              - text: •
              - paragraph [ref=e4948]: Impact on downstream tasks. Our SemiUHPE also has implications for broader head-related tasks. For 3D head generation, it can help diagnose and re-balance pose distributions in training datasets, mitigating bias caused by underrepresented large poses. For talking-head generation, robust estimation of extreme angles may reduce jittering artifacts in synthesized videos. For face-swapping, accurate pose priors can guide the alignment of wrapped facial textures, alleviating failures under large yaw angles. These extensions highlight the potential of SemiUHPE as a general building block for robust head-driven applications.
