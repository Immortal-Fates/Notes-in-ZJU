                  - generic [ref=e4238]: T
                  - generic [ref=e4239]: 𝖢𝗎𝗍𝖮𝖼𝖼
              - text: (even some metrics are better than FixMatch based on pseudo-label filtering), we can see the universality of
              - math [ref=e4240]:
                - generic [ref=e4242]:
                  - generic [ref=e4243]: T
                  - generic [ref=e4244]: 𝖢𝗎𝗍𝖮𝖼𝖼
              - text: . The two pseudo-label filtering methods we designed are better than the FixMatch based on static thresholds, indicating that reasonable dynamic filtering strategies are universally applicable. At the same time, the entropy-based one using the matrix Fisher distribution is significantly better, which is consistent with the previous analysis. In the future, we can try to extend Semi3DHead to more 3D head reconstruction datasets to fully leverage its ability to mine unlabeled head images.
