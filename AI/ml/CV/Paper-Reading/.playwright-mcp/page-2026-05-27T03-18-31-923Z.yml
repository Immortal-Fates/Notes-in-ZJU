                  - /url: https://arxiv.org/html/2404.02544v4#bib.bib30
                - text: "]"
              - text: ) regardless of the pseudo-label filtering scheme used. In addition, by observing the Mean-Teacher after applying the strong augmentation
              - math [ref=e4235]:
