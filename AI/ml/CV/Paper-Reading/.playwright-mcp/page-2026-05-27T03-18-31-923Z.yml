          - paragraph [ref=e237]: "The three above-mentioned strategies are complementary: cropping guarantees a stable and scale-invariant input, dynamic filtering ensures the reliability of semi-supervised training, and augmentations promote robustness against extreme pose and occlusion variations. Their synergy enables our framework to consistently improve accuracy and generalization in unconstrained HPE. In method section, we provide more details of them. We also present how these strategies can be utilized to solve the task generic object rotation regression similar to HPE and help improve another task 3D head reconstruction strongly related to HPE. Despite the simplicity, these seamless adaptations reveal valuable universality and scalability of SemiUHPE. In experiments, we demonstrate the effectiveness and versatility of our proposed strategies by extensive comparison and ablation studies. In addition, we give impressive qualitative estimation results on challenging wild heads, which is promising for downstream applications."
          - paragraph [ref=e239]: "To sum up, we mainly have five contributions: (1) The semi-supervised unrestricted head pose estimation (SemiUHPE) task for wild RGB images is proposed for the first time. (2) A well-performed framework including novel customized strategies for tackling the SemiUHPE problem is proposed. (3) Benchmarks with many baseline methods for the SemiUHPE are constructed. (4) New SOTA results are achieved under both front-range and full-range HPE settings. (5) Our proposed strategies are verified to be effortlessly applicable to promote two other tasks similar or relevant to unconstrained HPE."
          - paragraph [ref=e241]:
            - text: "Our content is organized as follows: Firstly, in Section"
