            - text: ", we present related works including various 2D head pose estimation methods, the popular semi-supervised learning algorithms, and some semi-supervised rotation regression researches about general objects. Then, in Section"
            - link "3" [ref=e243] [cursor=pointer]:
              - /url: https://arxiv.org/html/2404.02544v4#S3
            - text: ", we give a definition of the problem, the description of overall SemiUHPE framework, motivations, explanations of proposed strategies and adaptations for other tasks. After that, in Section"
            - link "4" [ref=e244] [cursor=pointer]:
